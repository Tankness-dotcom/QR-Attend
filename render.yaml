services:
  - type: web
    name: qr-attend
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: TURSO_URL
        sync: false   # set manually in Render dashboard
      - key: TURSO_TOKEN
        sync: false   # set manually in Render dashboard
